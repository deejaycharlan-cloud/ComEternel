services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:58025:8025"
      - "127.0.0.1:51025:1025"
    environment:
      MP_MAX_MESSAGES: 100
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: cometernel
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: cometernel
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cometernel -d cometernel"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
